name: OFRL Repository Policy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false

      - name: Pin npm toolchain
        run: |
          npm install --global npm@10.9.9 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "10.9.9"

      - name: Install locked schema validation tooling
        run: npm ci --prefix scripts/schema-validator --ignore-scripts --no-audit --no-fund

      - name: Validate local Markdown links, JSON, and YAML
        run: node scripts/validate_repository_files.cjs

      - name: Validate every registered project and manifest
        run: node scripts/validate_project_registry.cjs

      - name: Test project registry policy contracts
        run: node --test scripts/tests/validate-project-registry.test.cjs
