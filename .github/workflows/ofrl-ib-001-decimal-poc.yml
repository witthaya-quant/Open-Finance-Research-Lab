name: OFRL-IB-001 Numeric and Input Contract Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decimal-contract:
    name: Decimal contract (Rust ${{ matrix.rust }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.85.0"
          - "1.99.1"
    defaults:
      run:
        shell: bash
        working-directory: projects/OFRL-IB-001/poc/decimal-contract

    steps:
      # actions/checkout v7.0.1, pinned to its verified release commit.
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install selected Rust toolchain
        working-directory: .
        env:
          RUST_TOOLCHAIN: ${{ matrix.rust }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            echo "::error::rustup is not present on the ubuntu-24.04 runner; refusing to execute an unpinned remote bootstrap script." >&2
            exit 1
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Verify frozen dependency graph and licence metadata
        run: |
          set -euo pipefail

          metadata_file="$RUNNER_TEMP/ofrl-decimal-cargo-metadata.json"
          cargo metadata --locked --format-version 1 > "$metadata_file"
          cargo tree --locked --edges normal,build,dev

          command -v jq >/dev/null 2>&1 || {
            echo "::error::jq is required on the ubuntu-24.04 runner for dependency metadata validation."
            exit 1
          }

          registry_count="$(jq '[.packages[] | select((.source // "") | startswith("registry+"))] | length' "$metadata_file")"
          missing_licences="$(jq -r '
            [
              .packages[]
              | select((.source // "") | startswith("registry+"))
              | select((.license // "") == "")
              | "\(.name)@\(.version)"
            ] | .[]?
          ' "$metadata_file")"

          printf 'Resolved crates.io registry packages: %s\n' "$registry_count"
          printf 'Packages without declared Cargo licence metadata: %s\n' "$(printf '%s\n' "$missing_licences" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [[ -n "$missing_licences" ]]; then
            printf '::error::Registry packages without declared Cargo licence metadata:\n%s\n' "$missing_licences"
            exit 1
          fi

          # Preserve the publisher-declared expressions in the job log for review.
          jq -r '
            .packages[]
            | select((.source // "") | startswith("registry+"))
            | [.name, .version, .license] | @tsv
          ' "$metadata_file" | sort

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets -- --nocapture

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps

  model-input-schema:
    name: Model input JSON Schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false

      - name: Pin npm toolchain
        run: |
          npm install --global npm@10.9.9 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "10.9.9"

      - name: Validate Draft 2020-12 schema and fixtures
        run: bash scripts/validate-ofrl-ib-001-model-input-schema.sh

  numeric-envelope:
    name: Numeric envelope derivation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false

      - name: Run exact numeric-envelope and candidate-capacity tests
        run: |
          node --test \
            projects/OFRL-IB-001/tools/numeric-envelope/test/derive.test.cjs \
            projects/OFRL-IB-001/tools/numeric-envelope/test/candidate-capacity.test.cjs

      - name: Derive and check the test-only synthetic envelope
        run: |
          set -euo pipefail
          profile="projects/OFRL-IB-001/tools/numeric-envelope/test/fixtures/synthetic-profile.test-only.json"
          derivation="$RUNNER_TEMP/ofrl-numeric-envelope-test-only.json"
          rust_capacity="$RUNNER_TEMP/ofrl-numeric-envelope-rust-decimal-test-only.json"
          bigdecimal_capacity="$RUNNER_TEMP/ofrl-numeric-envelope-bigdecimal-test-only.json"

          node projects/OFRL-IB-001/tools/numeric-envelope/derive.cjs "$profile" > "$derivation"
          node projects/OFRL-IB-001/tools/numeric-envelope/candidate-capacity.cjs \
            "$derivation" --candidate rust_decimal_1_43_0 > "$rust_capacity"
          node projects/OFRL-IB-001/tools/numeric-envelope/candidate-capacity.cjs \
            "$derivation" --candidate bigdecimal_0_4_11 > "$bigdecimal_capacity"

          node -e '
            const fs = require("node:fs");
            const read = path => JSON.parse(fs.readFileSync(path, "utf8"));
            const derivation = read(process.env.RUNNER_TEMP + "/ofrl-numeric-envelope-test-only.json");
            const candidates = [
              read(process.env.RUNNER_TEMP + "/ofrl-numeric-envelope-rust-decimal-test-only.json"),
              read(process.env.RUNNER_TEMP + "/ofrl-numeric-envelope-bigdecimal-test-only.json")
            ];
            if (derivation.approval_state !== "test_only" ||
                derivation.derivation.candidate_backend_selected !== false ||
                derivation.derivation.production_engine_authorized !== false ||
                derivation.nodes.length < 100) {
              throw new Error("Numeric Envelope output failed its non-approval or completeness guard");
            }
            for (const result of candidates) {
              const statusIsConsistent =
                (result.static_capacity_status === "STATIC_BOUND_EXCEEDS_LIMIT" && result.bound_exceeds_limit_count > 0) ||
                (result.static_capacity_status === "CONDITIONAL" && result.bound_exceeds_limit_count === 0 && result.conditional_count > 0) ||
                (result.static_capacity_status === "STATIC_CAPACITY_WITHIN_DECLARED_PROFILE" && result.bound_exceeds_limit_count === 0 && result.conditional_count === 0);
              if (result.profile_id !== derivation.profile_id ||
                  result.node_count !== derivation.nodes.length ||
                  !statusIsConsistent ||
                  result.backend_selected !== false ||
                  result.production_engine_authorized !== false ||
                  result.runtime_correctness_status !== "NOT_EXECUTED" ||
                  result.operational_resource_status !== "NOT_MEASURED") {
                throw new Error("Candidate capacity output failed its test-only static-bound guard: " + result.candidate + " " + result.static_capacity_status);
              }
              process.stdout.write("PASS: " + result.candidate + " static test-fixture bound status=" + result.static_capacity_status + ", nodes=" + result.node_count + ", bound_exceeds_limit=" + result.bound_exceeds_limit_count + ", conditional=" + result.conditional_count + "; this is not an observed runtime failure and runtime/resource evidence remains open.\\n");
              process.stdout.write("  bound_exceedance_reason_counts=" + JSON.stringify(result.bound_exceedance_reason_counts) + "\\n");
              process.stdout.write("  conditional_reason_counts=" + JSON.stringify(result.conditional_reason_counts) + "\\n");
              if (result.bound_exceedance_examples.length > 0) {
                process.stdout.write("  bound_exceedance_examples=" + JSON.stringify(result.bound_exceedance_examples) + "\\n");
              }
            }
            process.stdout.write("PASS: exact candidate-neutral derivation emitted " + derivation.nodes.length + " arithmetic nodes; no backend or production approval was created.\\n");
          '

      - name: Package and checksum Numeric Envelope evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/ofrl-numeric-envelope-evidence"
          mkdir -p "$evidence_dir"

          cp "$RUNNER_TEMP/ofrl-numeric-envelope-test-only.json" "$evidence_dir/derivation.json"
          cp "$RUNNER_TEMP/ofrl-numeric-envelope-rust-decimal-test-only.json" "$evidence_dir/rust-decimal-capacity.json"
          cp "$RUNNER_TEMP/ofrl-numeric-envelope-bigdecimal-test-only.json" "$evidence_dir/bigdecimal-capacity.json"
          cp projects/OFRL-IB-001/tools/numeric-envelope/test/fixtures/synthetic-profile.test-only.json "$evidence_dir/profile.test-only.json"

          cat > "$evidence_dir/EVIDENCE.md" <<EOF
          # OFRL-IB-001 Numeric Envelope CI Evidence

          - Commit: $GITHUB_SHA
          - Profile approval state: test_only
          - Candidate backend selected: false
          - Production engine authorized: false
          - Numeric Envelope tests: passed in the preceding workflow step
          - Runtime candidate arithmetic: not executed by the static capacity evaluator
          - Operational resource limits: not measured by the static capacity evaluator

          The candidate results are conservative static-bound screens, not observed runtime outcomes or a production Numeric Profile approval.
          EOF

          (
            cd "$evidence_dir"
            sha256sum \
              EVIDENCE.md \
              bigdecimal-capacity.json \
              derivation.json \
              profile.test-only.json \
              rust-decimal-capacity.json > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload Numeric Envelope evidence bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (Node.js 24)
        with:
          name: ofrl-ib-001-numeric-envelope-test-only-${{ github.sha }}
          path: ${{ runner.temp }}/ofrl-numeric-envelope-evidence/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
