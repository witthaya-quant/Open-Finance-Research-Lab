name: OFRL-IB-001 Numeric and Input Contract Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decimal-contract:
    name: Decimal contract (Rust ${{ matrix.rust }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.85.0"
          - "1.99.1"
    defaults:
      run:
        shell: bash
        working-directory: projects/OFRL-IB-001/poc/decimal-contract

    steps:
      # actions/checkout v7.0.1, pinned to its verified release commit.
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install selected Rust toolchain
        working-directory: .
        env:
          RUST_TOOLCHAIN: ${{ matrix.rust }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            echo "::error::rustup is not present on the ubuntu-24.04 runner; refusing to execute an unpinned remote bootstrap script." >&2
            exit 1
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      # Temporary audit instrumentation: generate with the declared MSRV, capture
      # the real Cargo-resolved lockfile, and inspect the resolved dependency metadata.
      - name: Bootstrap and inspect isolated POC lockfile (temporary)
        if: matrix.rust == '1.85.0'
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 > /tmp/ofrl-poc-metadata.json
          cargo tree --locked --edges normal,build,dev > /tmp/ofrl-poc-dependency-tree.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/ofrl-poc-metadata.json").read_text())
          packages = sorted(data["packages"], key=lambda p: (p["name"], p["version"]))
          print("=== RESOLVED PACKAGE INVENTORY ===")
          for package in packages:
              source = package.get("source") or "workspace"
              license_expr = package.get("license") or "UNDECLARED"
              print(f'{package["name"]}=={package["version"]} | license={license_expr} | source={source}')
          print("=== PACKAGE COUNT ===")
          print(len(packages))
          PY
          echo "=== OFRL_POC_CARGO_LOCK_BASE64_BEGIN ==="
          base64 -w0 Cargo.lock
          echo
          echo "=== OFRL_POC_CARGO_LOCK_BASE64_END ==="

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets -- --nocapture

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps

  model-input-schema:
    name: Model input JSON Schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false

      - name: Pin npm toolchain
        run: |
          npm install --global npm@10.9.9 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "10.9.9"

      - name: Validate Draft 2020-12 schema and fixtures
        run: bash scripts/validate-ofrl-ib-001-model-input-schema.sh
