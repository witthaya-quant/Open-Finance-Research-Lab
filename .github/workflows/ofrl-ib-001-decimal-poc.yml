name: OFRL-IB-001 Numeric and Input Contract Checks

on:
  pull_request:
    paths:
      - ".github/workflows/ofrl-ib-001-decimal-poc.yml"
      - "README.md"
      - "projects/OFRL-IB-001/README.md"
      - "projects/OFRL-IB-001/RESEARCH_SPECIFICATION.md"
      - "projects/OFRL-IB-001/MODEL_CONVENTIONS.md"
      - "projects/OFRL-IB-001/VALIDATION_MATRIX.md"
      - "projects/OFRL-IB-001/poc/decimal-contract/**"
      - "projects/OFRL-IB-001/ENGINEERING_ARCHITECTURE.md"
      - "projects/OFRL-IB-001/DECISION_LOG.md"
      - "projects/OFRL-IB-001/MODEL_INPUT_CONTRACT.md"
      - "projects/OFRL-IB-001/NUMERIC_ENVELOPE.md"
      - "projects/OFRL-IB-001/VALIDATION_ERROR_CONTRACT.md"
      - "projects/OFRL-IB-001/SYNTHETIC_REFERENCE_CASE.md"
      - "schemas/ofrl-ib-001-amount-record-0.1.0.schema.json"
      - "schemas/ofrl-ib-001-model-input-0.1.0.schema.json"
      - "fixtures/synthetic/**"
      - "scripts/validate-ofrl-ib-001-model-input-schema.sh"
      - "scripts/validate-ofrl-ib-001-model-input-schema.cjs"
      - "scripts/schema-validator/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decimal-contract:
    name: Decimal contract (Rust ${{ matrix.rust }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.85.0"
          - "1.99.1"
    defaults:
      run:
        shell: bash
        working-directory: projects/OFRL-IB-001/poc/decimal-contract

    steps:
      # actions/checkout v7.0.1, pinned to its verified release commit.
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install selected Rust toolchain
        working-directory: .
        env:
          RUST_TOOLCHAIN: ${{ matrix.rust }}
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs \
              | sh -s -- -y --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets -- --nocapture

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps

  model-input-schema:
    name: Model input JSON Schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node v7.1.0, pinned to its verified release commit.
      - name: Set up pinned Node.js and npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.4"
          check-latest: false

      - name: Verify Node.js and npm toolchain
        run: |
          test "$(node --version)" = "v22.23.4"
          test "$(npm --version)" = "10.9.9"
          node --version
          npm --version

      # Temporary bootstrap step. Remove after the generated lockfile has
      # been committed; the normal verification script already uses npm ci.
      - name: Bootstrap package-lock for initial commit
        working-directory: scripts/schema-validator
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          base64 --wrap=0 package-lock.json

      - name: Validate Draft 2020-12 schema and fixtures
        run: bash scripts/validate-ofrl-ib-001-model-input-schema.sh
