name: OFRL-IB-001 Numeric and Input Contract Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decimal-contract:
    name: Decimal contract (Rust ${{ matrix.rust }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.85.0"
          - "1.99.1"
    defaults:
      run:
        shell: bash
        working-directory: projects/OFRL-IB-001/poc/decimal-contract

    steps:
      # actions/checkout v7.0.1, pinned to its verified release commit.
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install selected Rust toolchain
        working-directory: .
        env:
          RUST_TOOLCHAIN: ${{ matrix.rust }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            echo "::error::rustup is not present on the ubuntu-24.04 runner; refusing to execute an unpinned remote bootstrap script." >&2
            exit 1
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Verify frozen dependency graph and licence metadata
        run: |
          set -euo pipefail

          metadata_file="$RUNNER_TEMP/ofrl-decimal-cargo-metadata.json"
          cargo metadata --locked --format-version 1 > "$metadata_file"
          cargo tree --locked --edges normal,build,dev

          command -v jq >/dev/null 2>&1 || {
            echo "::error::jq is required on the ubuntu-24.04 runner for dependency metadata validation."
            exit 1
          }

          registry_count="$(jq '[.packages[] | select((.source // "") | startswith("registry+"))] | length' "$metadata_file")"
          missing_licences="$(jq -r '
            [
              .packages[]
              | select((.source // "") | startswith("registry+"))
              | select((.license // "") == "")
              | "\(.name)@\(.version)"
            ] | .[]?
          ' "$metadata_file")"

          printf 'Resolved crates.io registry packages: %s\n' "$registry_count"
          printf 'Packages without declared Cargo licence metadata: %s\n' "$(printf '%s\n' "$missing_licences" | sed '/^$/d' | wc -l | tr -d ' ')"

          if [[ -n "$missing_licences" ]]; then
            printf '::error::Registry packages without declared Cargo licence metadata:\n%s\n' "$missing_licences"
            exit 1
          fi

          # Preserve the publisher-declared expressions in the job log for review.
          jq -r '
            .packages[]
            | select((.source // "") | startswith("registry+"))
            | [.name, .version, .license] | @tsv
          ' "$metadata_file" | sort

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets -- --nocapture

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps

  model-input-schema:
    name: Model input JSON Schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false

      - name: Pin npm toolchain
        run: |
          npm install --global npm@10.9.9 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "10.9.9"

      - name: Validate Draft 2020-12 schema and fixtures
        run: bash scripts/validate-ofrl-ib-001-model-input-schema.sh

  numeric-envelope:
    name: Numeric envelope derivation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false

      - name: Run exact numeric-envelope unit tests
        run: node --test projects/OFRL-IB-001/tools/numeric-envelope/test/derive.test.cjs

      - name: Derive the test-only synthetic envelope
        run: |
          node projects/OFRL-IB-001/tools/numeric-envelope/derive.cjs \
            projects/OFRL-IB-001/tools/numeric-envelope/test/fixtures/synthetic-profile.test-only.json \
            > "$RUNNER_TEMP/ofrl-numeric-envelope-test-only.json"
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/ofrl-numeric-envelope-test-only.json", "utf8"));
            if (result.approval_state !== "test_only" ||
                result.derivation.candidate_backend_selected !== false ||
                result.derivation.production_engine_authorized !== false ||
                result.nodes.length < 100) {
              throw new Error("Numeric Envelope output failed its non-approval or completeness guard");
            }
            process.stdout.write("PASS: exact candidate-neutral derivation emitted " + result.nodes.length + " formula nodes; no backend or production approval was created.\\n");
          '
