name: OFRL-IB-001 Rust Runtime Semantic Validator

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-validator:
    name: Semantic validator (Rust ${{ matrix.rust }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.85.0"
          - "1.99.1"
    defaults:
      run:
        shell: bash
        working-directory: projects/OFRL-IB-001

    steps:
      # actions/checkout v7.0.1, pinned to its verified release commit.
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install selected Rust toolchain
        working-directory: .
        env:
          RUST_TOOLCHAIN: ${{ matrix.rust }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            echo "::error::rustup is not present on the ubuntu-24.04 runner; refusing to execute an unpinned remote bootstrap script." >&2
            exit 1
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-targets -- --nocapture

      - name: Build documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --no-deps

      - name: Validate canonical synthetic Case A through CLI
        run: cargo run --locked --quiet -p ofrl_cli -- validate ../../fixtures/synthetic/ofrl-ib-001-case-a.input.v0.1.0.json

      - name: Reject unsupported schema version through CLI
        run: |
          input="$(mktemp)"
          sed 's/"schema_version": "0.1.0"/"schema_version": "9.9.9"/' ../../fixtures/synthetic/ofrl-ib-001-case-a.input.v0.1.0.json > "$input"
          set +e
          cargo run --locked --quiet -p ofrl_cli -- validate "$input"
          status=$?
          set -e
          rm -f "$input"
          if [[ "$status" -ne 2 ]]; then
            echo "Expected CLI exit code 2 for rejected input; received $status"
            exit 1
          fi
