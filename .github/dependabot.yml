version: 2
updates:
  - package-ecosystem: cargo
    directory: /projects/OFRL-IB-001
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust

  - package-ecosystem: cargo
    directory: /projects/OFRL-IB-001/poc/decimal-contract
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - rust
      - research-poc

  - package-ecosystem: cargo
    directory: /projects/OFRL-CM-001/cases/2026-11-american-put/workbench
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - rust
      - cm-001

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: npm
    directory: /scripts/schema-validator
    schedule:
      interval: weekly
      day: monday
      time: "07:45"
      timezone: Asia/Bangkok
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - node
      - schema-validation
