[package]
name = "ofrl-decimal-contract-poc"
version = "0.1.0"
edition = "2021"
rust-version = "1.73"
publish = false
license = "Apache-2.0"
description = "Isolated numeric and interchange proof of concept for OFRL-IB-001"

[dependencies]
csv = "1"
rust_decimal = { version = "=1.43.0", features = ["serde", "serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
